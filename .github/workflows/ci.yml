name: All-in-one CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0,12 * * *" # Run at 00:00 and 12:00 UTC every day for automated data update
  workflow_dispatch:

concurrency:
  group: all-in-one-ci
  cancel-in-progress: false

jobs:
  update:
    name: Update data
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run update script
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update.py --token "$GH_TOKEN"
          if git status --porcelain | grep .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: auto update data"
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" push origin "HEAD:$GITHUB_REF_NAME"

  build:
    name: Build project
    runs-on: ubuntu-latest
    needs: update
    if: |
      always() && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        needs.update.outputs.changed == 'true'
      )
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - update
      - build
    if: |
      always() &&
      needs.build.result == 'success' && (
        github.event_name == 'push' ||
        needs.update.outputs.changed == 'true'
      )
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # make sure to checkout the latest updated data from the update job
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || github.sha }}

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: dist

      - name: Copy data
        run: cp -r data dist/data

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: dashboard.xiangshan.cc
          force_orphan: true
